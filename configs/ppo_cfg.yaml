# PPO hyperparameter configuration (YAML override for train.py)
# ---------------------------------------------------------------
# These values mirror the defaults in skrl_ppo_cfg.py.
# Edit this file and pass --cfg_file configs/ppo_cfg.yaml to
# a future config-loading extension of train.py for sweep experiments.

rollouts: 24
learning_epochs: 5
mini_batches: 4
discount_factor: 0.99
lambda: 0.95
learning_rate: 3.0e-4
ratio_clip: 0.2
value_clip: 0.2
clip_predicted_values: true
value_loss_scale: 1.0
entropy_loss_scale: 0.005
grad_norm_clip: 1.0
kl_threshold: 0.008    # for KLAdaptiveLR scheduler

# Environment
num_envs: 512
timesteps: 3_000_000

# Reward shaping weights (must match TriplePendulumEnvCfg)
action_scale: 20.0
upright_kernel: 10.0
rew_upright_scale: 1.0
rew_ang_vel_scale: -0.01
rew_cart_pos_scale: -0.01
rew_cart_vel_scale: -0.001
rew_survive_scale: 0.5

# Termination thresholds
max_cart_pos: 2.0
max_pole_angle_deg: 30.0    # converted to radians in env cfg (π/6)
